<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolutionZ Ticketing Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --navy:#1F3864; --navy-2:#2A4A80; --teal:#0E9384; --teal-50:#E6F5F3; --amber:#F0A030; --amber-50:#FDF3E1;
  --blue:#3B6FD4; --blue-50:#EAF0FB; --red:#D9534F; --red-50:#FBECEB; --slate:#5B6B82; --violet:#7A5CC7;
  --bg:#F7F8FC; --brand:#4F5BD5; --brand-d:#3F4AC4; --brand-50:#EEF0FD; --card:#FFFFFF; --line:#E1E6EF; --text:#1B2333; --muted:#6B778C;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:#fff;color:var(--text);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px;display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6C78F0,#4F5BD5);color:#fff;display:grid;place-items:center;flex:0 0 34px;font-weight:800;font-size:18px;letter-spacing:-.02em;box-shadow:0 4px 10px rgba(79,91,213,.3)}
.brand b{display:block;font-size:16px;line-height:1.2;letter-spacing:-.01em}.brand b em{font-style:normal;color:var(--brand)}
.brand span{font-size:11.5px;color:var(--muted)}
.role-chip{margin:4px 18px 12px;padding:6px 10px;border-radius:8px;background:var(--brand-50);color:var(--brand-d);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.nav{flex:1;padding:4px 10px;overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:#4A5568;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:#F3F5FA;color:var(--text)}
.nav button.on{background:var(--brand-50);color:var(--brand-d);font-weight:600}
.nav button.on svg{color:var(--brand)}
.nav .cnt{margin-left:auto;background:var(--amber);color:#1B2333;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:600}
.side-foot{padding:14px 18px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}
.top .grow{flex:1}
.demo-banner{background:var(--amber-50);color:#7A4E07;font-size:12.5px;padding:7px 24px;border-bottom:1px solid #F3DDB3;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:24px;max-width:1240px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 42px}
.stat b{font-size:24px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#C7D0DF;background:#FAFBFD}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.navy{background:var(--brand-50);border-color:#D6DAFA;color:var(--brand-d)}
.btn.danger{color:var(--red);border-color:#F1C9C7}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:10.5px;padding:0 5px;min-width:17px;height:17px;display:grid;place-items:center;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Open{background:var(--blue-50);color:var(--blue)}
.s-InProgress{background:var(--amber-50);color:#B26B00}
.s-OnHold{background:#EEF0F4;color:var(--slate)}
.s-Resolved{background:var(--teal-50);color:var(--teal)}
.s-Closed{background:#E4E9F2;color:var(--navy)}
.p-Critical{color:var(--red)} .p-High{color:#C46A00} .p-Medium{color:var(--blue)} .p-Low{color:var(--slate)}
.prio{font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.prio::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.a-InStock{background:var(--teal-50);color:var(--teal)} .a-Assigned{background:var(--blue-50);color:var(--blue)} .a-UnderRepair{background:var(--amber-50);color:#B26B00} .a-Retired{background:#EEF0F4;color:var(--slate)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#F0F3F8;font-size:12px;color:var(--slate);font-weight:500}
.overdue{background:var(--red-50);color:var(--red);padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}

table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#F8FAFD}
tbody tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto}
.empty{padding:36px;text-align:center;color:var(--muted)}

.tabs{display:flex;gap:4px;background:#EEF1F6;padding:4px;border-radius:10px;width:max-content}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--slate)}
.tabs button.on{background:#fff;color:var(--brand-d);box-shadow:var(--shadow)}
.tabs .n{background:#DDE3EE;border-radius:10px;padding:0 7px;font-size:11.5px;margin-left:5px}
.tabs button.on .n{background:var(--brand);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;outline:none;width:100%}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,91,213,.15)}
.filters .input{width:auto;min-width:130px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
textarea.input{min-height:96px;resize:vertical}

.scan-box{border:2px dashed #C9CEF6;background:#F6F7FE;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.scan-row{display:flex;gap:8px;flex-wrap:wrap}
.scan-row .input{flex:1;min-width:180px}
.asset-mini{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.asset-mini .ic{width:38px;height:38px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:0 0 38px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

.thread{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 32px}
.bubble{background:#F5F7FB;border-radius:10px;padding:10px 12px;flex:1}
.bubble.note{background:var(--amber-50);border:1px dashed #F0C77C}
.bubble.sys{background:none;padding:4px 0;color:var(--muted);font-size:12.5px}
.bubble .meta{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bubble p{margin:0;white-space:pre-wrap}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:10px;background:#EEF1F6;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:200px}
.toast-wrap{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#2D3748;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;max-width:340px;animation:in .2s ease}
.toast.ok{background:var(--teal)} .toast.warn{background:#B26B00}
@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.notif-pop{position:absolute;right:24px;top:58px;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.15);z-index:20;max-height:420px;overflow:auto}
.notif{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.notif.unread{background:#F3F8FF}
.notif:hover{background:#F8FAFD}

.label-card{width:320px;border:1.5px solid var(--text);border-radius:8px;padding:12px 14px;background:#fff}
.label-card .lh{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.label-card svg{width:100%;height:auto}
.stars button{border:0;background:none;font-size:24px;cursor:pointer;color:#D0D6E0;padding:0 2px}
.stars button.on{color:var(--amber)}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps div{padding:6px 12px;border-radius:20px;background:#EEF1F6;font-size:12.5px;font-weight:600;color:var(--slate)}
.steps div.on{background:var(--brand);color:#fff}
.steps div.done{background:var(--teal-50);color:var(--teal)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-l{background:radial-gradient(circle at 15% 10%,#E3E7FD 0,transparent 45%),linear-gradient(160deg,#EEF0FD 0%,#F7F8FC 70%);color:var(--text);border-right:1px solid var(--line);padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login-l h1{font-size:34px;margin:28px 0 12px}
.login-l p{color:#4A5568;max-width:440px;font-size:15px}
.feat{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.feat div{display:flex;gap:10px;align-items:center;font-size:14px;color:#2D3748}
.feat svg{color:var(--brand)}
.login-r{display:flex;align-items:center;justify-content:center;padding:40px}
.role-card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.role-card:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,91,213,.12)}
.role-card .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:0 0 46px}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g-main,.g3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex:none}
  .nav{display:flex;overflow-x:auto;padding:0 10px 10px}
  .nav button{white-space:nowrap;width:auto}
  .side-foot,.role-chip{display:none}
  .content{padding:16px}
  .top{padding:0 16px}
  .g2,.form-grid{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login-l{padding:32px 20px}
  .kv{grid-template-columns:110px 1fr}
  .notif-pop{right:8px;width:calc(100% - 16px)}
}
@media print{
  body *{visibility:hidden}
  #printable,#printable *{visibility:visible}
  #printable{position:absolute;left:0;top:0}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ================= Icons ================= */
const I = {
  ticket:'<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M13 5v2M13 11v2M13 17v2"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  print:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  clip:'<path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  laptop:'<rect x="4" y="4" width="16" height="11" rx="1"/><path d="M2 19h20"/>',
};
const ic = (n, s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;

/* ================= Data ================= */
const KEY = 'solutionz-demo-v1';
const H = 3600e3, D = 24*H;
const CATS = ['Hardware','Software','Network','Printer','Email & Accounts','Access Request','Other'];
const PRIOS = ['Critical','High','Medium','Low'];
const STATUSES = ['Open','In Progress','On Hold','Resolved','Closed'];
const ASSET_CATS = ['Laptop','Desktop','Monitor','Printer','Network','Peripheral','UPS'];
const ASSET_STATUS = ['In Stock','Assigned','Under Repair','Retired'];
const DEPTS = ['Administration','IT','Finance','HR','Sales','Operations'];
const LOCS = ['Head Office – Floor 1','Head Office – Floor 2','Head Office – Floor 3','Warehouse','Branch Office'];

let DB;
function load(){ try{ const s=localStorage.getItem(KEY); DB = s?JSON.parse(s):seed(); }catch(e){ DB=seed(); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }
function resetDemo(){ DB=seed(); save(); S.view='dashboard'; S.ticket=null; render(); toast('Demo data reset','ok'); }

const userById = id => DB.users.find(u=>u.id===id);
const assetById = id => DB.assets.find(a=>a.id===id);
const ticketById = id => DB.tickets.find(t=>t.id===id);

/* ================= Utils ================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls = s => String(s).replace(/\s/g,'');
const fmtDate = t => new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT = t => new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function ago(t){ const d=(Date.now()-t)/1000; if(d<60)return 'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; }
function dur(ms){ const h=ms/H; if(h<1)return Math.round(h*60)+' min'; if(h<48)return h.toFixed(1)+' h'; return (h/24).toFixed(1)+' days'; }
const initials = n => n.split(' ').map(x=>x[0]).slice(0,2).join('');
const avColor = id => ({u1:'#7A5CC7',u2:'#0E9384',u3:'#3B6FD4',u4:'#C46A00',u5:'#D9534F',u6:'#1F3864',u7:'#5B6B82'}[id]||'#5B6B82');
const av = (id,size=32) => { const u=userById(id); return `<div class="av" style="background:${avColor(id)};width:${size}px;height:${size}px;flex-basis:${size}px">${esc(u?initials(u.name):'?')}</div>`; };
const pill = s => `<span class="pill s-${cls(s)}">${esc(s)}</span>`;
const apill = s => `<span class="pill a-${cls(s)}">${esc(s)}</span>`;
const prio = p => `<span class="prio p-${p}">${p}</span>`;
const isOpen = t => ['Open','In Progress','On Hold'].includes(t.status);
const slaDue = t => t.createdAt + DB.settings.sla[t.priority]*H;
const isOverdue = t => isOpen(t) && Date.now() > slaDue(t);
function toast(msg,type=''){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(),3200); }
function log(text){ DB.audit.unshift({t:Date.now(),by:S.me,text}); }
function notify(to,text,ticketId){ DB.notifications.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),to,text,ticketId,t:Date.now(),read:false}); }
function myNotifs(){ const u=me(); return DB.notifications.filter(n=>n.to===u.id||n.to===u.role); }
function randomEAN(){ let d=''; for(let i=0;i<12;i++) d+=Math.floor(Math.random()*10); let s=0; for(let i=0;i<12;i++) s+=(+d[i])*(i%2?3:1); return d+((10-s%10)%10); }
function csv(rows,name){ const c=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'})); a.download=name; a.click(); toast('Exported '+name,'ok'); }
function findAssetByCode(code){ code=String(code).trim().toUpperCase(); return DB.assets.find(a=>a.barcode.toUpperCase()===code||a.serial.toUpperCase()===code); }

  root.innerHTML = `
  <div class="app">

        <div class="grow"></div>
        <button class="btn sm" onclick="logout()" title="Switch role">${ic('refresh',15)} Switch role</button>

function notifPop(){
  const list=myNotifs().slice(0,15);
  return `<div class="notif-pop"><div class="card-head"><h3>Notifications</h3><a class="small" onclick="markAllRead()">Mark all read</a></div>
  ${list.length?list.map(n=>`<div class="notif ${n.read?'':'unread'}" onclick="openNotif('${n.id}')"><div>${esc(n.text)}</div><div class="small muted">${ago(n.t)}</div></div>`).join(''):'<div class="empty">No notifications</div>'}</div>`;
}
function markAllRead(){ myNotifs().forEach(n=>n.read=true); save(); render(); }
function openNotif(id){ const n=DB.notifications.find(x=>x.id===id); n.read=true; save(); if(n.ticketId) openTicket(n.ticketId); else render(); }
function view(){
  const r=me().role, v=S.view;
  if(v==='ticket') return ticketDetail();
  if(r==='user') return ({dashboard:userDash,launch:launchView,mytickets:myTickets,myassets:myAssets}[v]||userDash)();
  if(r==='it') return ({dashboard:itDash,resolve:resolvePanel,intake:intakeView,inventory:inventoryView,lookup:lookupView}[v]||itDash)();
  return ({dashboard:adminDash,alltickets:allTickets,inventory:inventoryView,users:usersView,performance:perfView,reports:reportsView,audit:auditView,settings:settingsView}[v]||adminDash)();
}

/* ================= Shared pieces ================= */
function stat(icon,val,label,color,bg){ return `<div class="card stat"><div class="ic" style="background:${bg};color:${color}">${ic(icon,20)}</div><div><b>${val}</b><span>${label}</span></div></div>`; }
function pageHead(title,sub,actions=''){ return `<div class="page-head"><div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div></div>`; }
function ticketTable(list,{cols=['no','title','prio','status','raised','asset','assigned','updated'],empty='No tickets found'}={}){
  if(!list.length) return `<div class="empty">${empty}</div>`;
  const head={no:'Ticket',title:'Subject',prio:'Priority',status:'Status',raised:'Raised by',asset:'Asset',assigned:'Assigned to',updated:'Updated',ttr:'Time to resolve',cat:'Category'};
  const cell=(t,c)=>{ switch(c){
    case 'no': return `<td class="mono small"><b>${t.no}</b></td>`;
    case 'title': return `<td><div style="font-weight:600">${esc(t.title)}</div><div class="small muted">${esc(t.category)} ${isOverdue(t)?'<span class="overdue">SLA breached</span>':''}</div></td>`;
    case 'cat': return `<td>${esc(t.category)}</td>`;
    case 'prio': return `<td>${prio(t.priority)}</td>`;
    case 'status': return `<td>${pill(t.status)}</td>`;
    case 'raised': { const u=userById(t.raisedBy); return `<td><div>${esc(u.name)}</div><div class="small muted">${esc(u.dept)}</div></td>`; }
    case 'asset': { const a=assetById(t.assetId); return `<td>${a?`<span class="mono small">${a.serial}</span>`:'<span class="muted small">—</span>'}</td>`; }
    case 'assigned': return `<td>${t.assignedTo?esc(userById(t.assignedTo).name):'<span class="tag">Unassigned</span>'}</td>`;
    case 'updated': return `<td class="small muted">${ago(t.updatedAt)}</td>`;
    case 'ttr': return `<td class="small">${t.resolvedAt?dur(t.resolvedAt-t.createdAt):'—'}</td>`;
  }};
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${head[c]}</th>`).join('')}</tr></thead><tbody>${list.map(t=>`<tr class="click" onclick="openTicket('${t.id}')">${cols.map(c=>cell(t,c)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function openTicket(id){ S.from = S.view==='ticket'?S.from:S.view; S.view='ticket'; S.ticket=id; S.notifOpen=false; render(); window.scrollTo(0,0); }
function assetMini(a,extra=''){ if(!a) return ''; const u=a.assignedTo?userById(a.assignedTo):null; return `<div class="asset-mini"><div class="ic">${ic(a.category==='Printer'?'print':a.category==='Network'?'link':'laptop',18)}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(a.name)}</div><div class="small muted"><span class="mono">${a.serial}</span> · ${esc(a.category)} · ${u?esc(u.name):esc(a.dept)}</div></div>${apill(a.status)}${extra}</div>`; }

let scanner=null;
function openScanner(cb){
  window._scanCb=cb;
  document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeScanner()"><div class="modal">
    <div class="modal-head"><h2>${ic('camera')} Scan barcode</h2><button class="btn ghost sm" onclick="closeScanner()">${ic('x')}</button></div>

function takeTicket(id){ const t=ticketById(id); t.assignedTo=S.me; if(t.status==='Open') t.status='In Progress'; touch(t,S.me,'status','Picked up the ticket and set status to In Progress'); notify(t.raisedBy,`${me().name} is now working on ${t.no}`,t.id); log('Picked up '+t.no); save(); render(); toast(t.no+' assigned to you','ok'); }
function setStatus(id,st,reopen){

  if(reopen){ t.status='Open'; t.resolvedAt=null; t.closedAt=null; t.feedback=null; touch(t,S.me,'status','Reopened the ticket'); notify('it',`${t.no} was reopened`,t.id); if(t.assignedTo) notify(t.assignedTo,`${t.no} was reopened`,t.id); }
  else { if(!t.assignedTo&&me().role==='it') t.assignedTo=S.me; t.status=st; if(st==='Resolved'){ t.resolvedAt=now; notify(t.raisedBy,`${t.no} has been resolved — please confirm`,t.id);} else notify(t.raisedBy,`${t.no} status changed to ${st}`,t.id); touch(t,S.me,'status','Status changed to '+st); }
  if(t.assetId){ const a=assetById(t.assetId); if(st==='In Progress'&&a.category==='Printer'){} }
  log(`${reopen?'Reopened':'Changed status of'} ${t.no}${reopen?'':' to '+st}`); save(); render(); toast(`${t.no}: ${reopen?'reopened':st}`,'ok');
}
function confirmClose(id){ const t=ticketById(id); const now=Date.now(); t.status='Closed'; t.closedAt=now; t.feedback={rating:S.rating||5,comment:document.getElementById('fb').value.trim()}; touch(t,S.me,'status','Confirmed resolution and closed the ticket'); if(t.assignedTo) notify(t.assignedTo,`${t.no} closed by user — rated ${t.feedback.rating}★`,t.id); S.rating=null; log('Closed '+t.no); save(); render(); toast(t.no+' closed — thank you for the feedback','ok'); }
function postMsg(type){ const el=document.getElementById('reply'), txt=el.value.trim(); if(!txt) return; const t=ticketById(S.ticket); touch(t,S.me,type,txt);

function nextSerial(){ return `${DB.settings.serialPrefix}-${new Date().getFullYear()}-${String(DB.seq.asset+1).padStart(5,'0')}`; }
function intakeScan(code){ code=String(code||'').trim(); if(!code) return; const ex=findAssetByCode(code);
  if(ex){ S.intake={step:1,dup:ex.id,code}; render(); toast('Duplicate: this product is already registered','warn'); return; }
  const td=new Date().toISOString().slice(0,10), w=new Date(); w.setFullYear(w.getFullYear()+2);
  S.intake={step:2,code,serial:nextSerial(),p:{name:'',category:'Laptop',brand:'',model:'',purchaseDate:td,warrantyUntil:w.toISOString().slice(0,10)}}; render(); }
function fillSample(){ const s=[['HP EliteBook 840 G10','Laptop','HP','EliteBook 840 G10'],['Dell OptiPlex 7010','Desktop','Dell','OptiPlex 7010'],['Epson EcoTank L3250','Printer','Epson','L3250'],['Samsung 24" S3 Monitor','Monitor','Samsung','LS24C310']][Math.floor(Math.random()*4)];
  document.getElementById('p-name').value=s[0]; document.getElementById('p-cat').value=s[1]; document.getElementById('p-brand').value=s[2]; document.getElementById('p-model').value=s[3]; }
function saveIntake(){ const g=id=>document.getElementById(id).value.trim(); if(!g('p-name')){ toast('Enter the product name','warn'); return; }
  const st=S.intake, now=Date.now(); DB.seq.asset++; const id='a'+DB.seq.asset+'_'+now.toString(36);
  const a={id,serial:st.serial,barcode:st.code,name:g('p-name'),category:g('p-cat'),brand:g('p-brand'),model:g('p-model'),purchaseDate:g('p-pd'),warrantyUntil:g('p-wy'),status:'In Stock',assignedTo:null,dept:'IT',location:g('p-loc'),createdAt:now,history:[{t:now,text:`Registered in inventory by barcode scan (${me().name})`}]};
  DB.assets.unshift(a); log(`Registered asset ${a.serial} (${a.name})`); save(); S.intake={step:3,assetId:id}; render(); toast('Serial '+a.serial+' generated','ok'); }

      <label class="f" style="margin-top:10px">Status</label><select class="input" id="as-status">${ASSET_STATUS.map(d=>`<option ${a.status===d?'selected':''}>${d}</option>`).join('')}</select>
      <button class="btn pri" style="margin-top:14px;width:100%;justify-content:center" onclick="saveAsset('${a.id}')">Save changes</button></div>`:''}
    <div class="card card-pad"><h3 style="margin-bottom:10px">Label</h3><div id="printable"><div class="label-card" style="width:100%"><div class="lh"><span>Asset Tag</span><span>${esc(a.category)}</span></div><div style="font-weight:600;margin:6px 0 2px">${esc(a.name)}</div><svg data-barcode="${a.serial}"></svg></div></div><button class="btn sm" style="margin-top:10px" onclick="window.print()">${ic('print',14)} Print label</button></div>
    <div class="card card-pad"><h3 style="margin-bottom:10px">Asset history</h3><div style="display:flex;flex-direction:column;gap:9px">${a.history.slice(0,10).map(h=>`<div class="small"><div>${esc(h.text)}</div><div class="muted">${fmtDT(h.t)}</div></div>`).join('')}</div></div>

function saveAsset(id){ const a=assetById(id), g=x=>document.getElementById(x).value; const nu=g('as-user')||null, now=Date.now(); const changes=[];
  if(nu!==a.assignedTo){ a.assignedTo=nu; changes.push(nu?'Assigned to '+userById(nu).name:'Unassigned'); if(nu){ a.status='Assigned'; notify(nu,`${a.name} (${a.serial}) has been assigned to you`,null);} }
  if(g('as-dept')!==a.dept){ a.dept=g('as-dept'); changes.push('Department → '+a.dept); }
  if(g('as-loc')!==a.location){ a.location=g('as-loc'); changes.push('Location → '+a.location); }
  const st=nu&&changes[0]?.startsWith('Assigned')?'Assigned':g('as-status'); if(st!==a.status||changes.length){ if(st!==a.status) changes.push('Status → '+st); a.status=st; }
  if(!changes.length){ toast('No changes'); return; }
  changes.forEach(c=>a.history.unshift({t:now,text:c+' by '+me().name})); log(`Updated asset ${a.serial}: ${changes.join(', ')}`); save(); render(); toast('Asset updated','ok'); }

function bars(data,color){ const max=Math.max(1,...data.map(d=>d[1])); return `<div class="bars">${data.map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:${color}"></div></div><b style="text-align:right">${v}</b></div>`).join('')}</div>`; }
function donut(parts){ const total=parts.reduce((s,p)=>s+p[1],0)||1; let acc=0; const r=52,c=2*Math.PI*r;
  return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#EEF1F6" stroke-width="18"/>${parts.map(([k,v,col])=>{const len=v/total*c; const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`; acc+=len; return s;}).join('')}<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2333">${total}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#6B778C">tickets</text></svg>
  <div class="legend">${parts.map(([k,v,col])=>`<div><i style="background:${col}"></i>${k} <b>${v}</b></div>`).join('')}</div></div>`; }
const statusParts = () => [['Open','#3B6FD4'],['In Progress','#F0A030'],['On Hold','#5B6B82'],['Resolved','#0E9384'],['Closed','#1F3864']].map(([s,c])=>[s,DB.tickets.filter(t=>t.status===s).length,c]);
function avgRes(list){ const r=list.filter(t=>t.resolvedAt); return r.length?dur(r.reduce((s,t)=>s+(t.resolvedAt-t.createdAt),0)/r.length):'—'; }

function addUserModal(){
  document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="modal-head"><h2>Add user</h2><button class="btn ghost sm" onclick="document.getElementById('modal-root').innerHTML=''">${ic('x')}</button></div>
  <div class="modal-body"><div class="form-grid"><div class="full"><label class="f">Full name *</label><input class="input" id="nu-name" data-autofocus></div><div class="full"><label class="f">Email *</label><input class="input" id="nu-email" type="email"></div>
  <div><label class="f">Department</label><select class="input" id="nu-dept">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select></div><div><label class="f">Role</label><select class="input" id="nu-role"><option value="user">End User</option><option value="it">IT Staff</option><option value="admin">Admin</option></select></div>
  <div class="full"><label class="f">Location</label><select class="input" id="nu-loc">${LOCS.map(d=>`<option>${d}</option>`).join('')}</select></div></div></div>
  <div class="modal-foot"><button class="btn" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button><button class="btn pri" onclick="addUser()">Add user</button></div></div></div>`;
  document.getElementById('nu-name').focus();
}
function addUser(){ const g=x=>document.getElementById(x).value.trim(); if(!g('nu-name')||!g('nu-email')){ toast('Name and email are required','warn'); return; }
  const u={id:'u'+Date.now().toString(36),name:g('nu-name'),email:g('nu-email'),dept:g('nu-dept'),role:g('nu-role'),location:g('nu-loc'),active:true}; DB.users.push(u); log('Added user '+u.name); save(); document.getElementById('modal-root').innerHTML=''; render(); toast('User added','ok'); }
function perfView(){
  const staff=DB.users.filter(u=>u.role==='it');
  return pageHead('IT staff performance','Tickets resolved, workload and average resolution time per IT staff member.')+
  `<div class="grid g2" style="margin-bottom:16px">${staff.map(s=>{const mine=DB.tickets.filter(t=>t.assignedTo===s.id), done=mine.filter(t=>t.resolvedAt), fb=mine.filter(t=>t.feedback); const rating=fb.length?(fb.reduce((a,t)=>a+t.feedback.rating,0)/fb.length).toFixed(1):'—';
    return `<div class="card card-pad"><div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${av(s.id,42)}<div><h2>${esc(s.name)}</h2><div class="small muted">${esc(s.email)}</div></div></div>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:10px">${[['Resolved',done.length],['Active',mine.filter(isOpen).length],['Avg. time',avgRes(mine)],['Rating',rating+(fb.length?'★':'')]].map(([k,v])=>`<div style="background:var(--bg);border-radius:10px;padding:10px"><b style="font-size:18px">${v}</b><div class="small muted">${k}</div></div>`).join('')}</div></div>`;}).join('')}</div>
  <div class="card card-pad"><h2 style="margin-bottom:14px">Workload — active tickets per staff member</h2>${bars([...staff.map(s=>[s.name,DB.tickets.filter(t=>t.assignedTo===s.id&&isOpen(t)).length]),['Unassigned',DB.tickets.filter(t=>isOpen(t)&&!t.assignedTo).length]],'#F0A030')}</div>`;
}
function reportsView(){
  const T=DB.tickets; const faulty=DB.assets.map(a=>[a.name+' ('+a.serial.slice(-5)+')',T.filter(t=>t.assetId===a.id).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const weeks=[3,2,1,0].map(w=>{const end=Date.now()-w*7*D,start=end-7*D; return [w===0?'This week':w+'w ago',T.filter(t=>t.createdAt>=start&&t.createdAt<end).length];});
  return pageHead('Reports & analytics','Ticket volume, resolution and inventory reports — export to Excel/CSV or print to PDF.',`<button class="btn" onclick="exportTickets()">${ic('download',15)} Tickets CSV</button><button class="btn" onclick="exportAssets()">${ic('download',15)} Inventory CSV</button><button class="btn navy" onclick="window.print()">${ic('print',15)} Print / PDF</button>`)+
  `<div id="printable" style="width:100%"><div class="grid g4" style="margin-bottom:16px">${stat('ticket',T.length,'Total tickets','#1F3864','#E4E9F2')}${stat('alert',T.filter(isOpen).length,'Open','#3B6FD4','#EAF0FB')}${stat('check',T.filter(t=>!isOpen(t)).length,'Resolved / closed','#0E9384','#E6F5F3')}${stat('clock',avgRes(T),'Avg. resolution time','#7A5CC7','#F1EDFA')}</div>
  <div class="grid g2" style="margin-bottom:16px"><div class="card card-pad"><h2 style="margin-bottom:14px">Ticket volume by week</h2>${bars(weeks,'#4F5BD5')}</div><div class="card card-pad"><h2 style="margin-bottom:14px">Open vs closed</h2>${donut(statusParts())}</div></div>
  <div class="grid g3"><div class="card card-pad"><h2 style="margin-bottom:14px">Most frequently faulty assets</h2>${bars(faulty,'#D9534F')}</div><div class="card card-pad"><h2 style="margin-bottom:14px">Problem categories</h2>${bars(CATS.map(c=>[c,T.filter(t=>t.category===c).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),'#0E9384')}</div>
  <div class="card card-pad"><h2 style="margin-bottom:14px">Inventory summary</h2>${bars(ASSET_STATUS.map(s=>[s,DB.assets.filter(a=>a.status===s).length]),'#3B6FD4')}<div style="margin-top:14px">${bars(ASSET_CATS.map(c=>[c,DB.assets.filter(a=>a.category===c).length]).filter(x=>x[1]),'#7A5CC7')}</div></div></div></div>`;
}
function auditView(){
  return pageHead('Audit log','Every action recorded with user and time.')+
  `<div class="card"><div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th></tr></thead><tbody>${DB.audit.slice(0,100).map(l=>`<tr><td class="small muted" style="white-space:nowrap">${fmtDT(l.t)}</td><td><div style="display:flex;gap:8px;align-items:center">${av(l.by,26)}${esc(userById(l.by)?.name||'—')}</div></td><td>${esc(l.text)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function settingsView(){
  const s=DB.settings;
  return pageHead('System settings','Serial number format, SLA targets and categories.')+
  `<div class="grid g2"><div class="card card-pad"><h2 style="margin-bottom:4px">Serial number format</h2><p class="small muted" style="margin:0 0 12px">Applied to every product registered through barcode scanning.</p>
  <label class="f">Prefix</label><input class="input mono" id="set-prefix" value="${esc(s.serialPrefix)}" maxlength="6">
  <p class="small" style="margin:10px 0 0">Next serial: <b class="mono">${nextSerial()}</b></p>
  <h2 style="margin:22px 0 4px">SLA targets</h2><p class="small muted" style="margin:0 0 12px">Hours to resolve before an SLA breach warning is raised.</p>
  <div class="form-grid">${PRIOS.map(p=>`<div><label class="f">${p}</label><input type="number" min="1" class="input" id="sla-${p}" value="${s.sla[p]}"></div>`).join('')}</div>
  <button class="btn pri" style="margin-top:16px" onclick="saveSettings()">Save settings</button></div>
  <div class="card card-pad"><h2 style="margin-bottom:12px">Ticket categories</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${CATS.map(c=>`<span class="tag" style="font-size:13px;padding:5px 10px">${c}</span>`).join('')}</div>
  <h2 style="margin:22px 0 12px">Asset categories</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${ASSET_CATS.map(c=>`<span class="tag" style="font-size:13px;padding:5px 10px">${c}</span>`).join('')}</div>
  <h2 style="margin:22px 0 8px">Notifications</h2><div class="small" style="display:flex;flex-direction:column;gap:6px"><div>✓ Email & in-app on ticket creation, assignment and status change</div><div>✓ IT alerts for new and high-priority tickets</div><div>✓ SLA breach warnings</div><div>✓ User notified when ticket is resolved or closed</div></div></div></div>`;
}
function saveSettings(){ const p=document.getElementById('set-prefix').value.trim().toUpperCase()||'AST'; DB.settings.serialPrefix=p; PRIOS.forEach(x=>{ DB.settings.sla[x]=Math.max(1,+document.getElementById('sla-'+x).value||DB.settings.sla[x]); }); log('Updated system settings'); save(); render(); toast('Settings saved','ok'); }

document.addEventListener('click',e=>{ if(S.notifOpen&&!e.target.closest('.notif-pop')&&!e.target.closest('.icon-btn')){ S.notifOpen=false; render(); } });
load(); render();
</script>
</body>
</html>
